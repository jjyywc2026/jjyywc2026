name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: "单词学习"
  VERSION: "1.4.8"
  BUILD_NUMBER: "18"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 requests cryptography

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          flet build apk \
            --org com.wordlearning \
            --project wordlearning \
            --product "单词学习" \
            --module-name main \
            --icon assets/app_icon.png \
            --build-version ${{ env.VERSION }} \
            --build-number ${{ env.BUILD_NUMBER }} \
            --android-permissions INTERNET=True \
            --android-permissions ACCESS_NETWORK_STATE=True \
            --exclude "*.bat" "*.spec" "test_*.py" "storage" "dist" \
            -v

      - name: Find APK
        run: |
          echo "=== Build output ==="
          find build -name "*.apk" -type f 2>/dev/null
          ls -la build/apk/ 2>/dev/null || echo "No build/apk dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordlearning-apk-v1.4.8
          path: |
            build/apk/**/*.apk
            build/**/*.apk
          if-no-files-found: error
          retention-days: 30
